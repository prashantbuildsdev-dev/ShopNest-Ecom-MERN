$kind: http-request
url: "{{baseUrl}}/api/payment/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "razorpay_order_id": "{{razorpayOrderId}}",
      "razorpay_payment_id": "{{razorpayPaymentId}}",
      "razorpay_signature": "{{razorpaySignature}}"
    }
order: 2000
